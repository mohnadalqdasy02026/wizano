name: shop_app
description: "WIZANO | وزانو — تطبيق صاحب المحل لإدارة الديون والمشتريات والمدفوعات"
publish_to: 'none'
version: 0.1.1+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.4.0
  intl: any
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  sherpa_onnx: ^1.13.8
  record: ^6.0.0
  path_provider: ^2.1.4
  crypto: ^3.0.6
  permission_handler: ^11.3.1
  archive: ^4.0.2
  flutter_secure_storage: ^10.3.4

# نستبدل حزمة web الخاصة بـ sherpa-onnx بنسخة محلية بلا أصول:
# ملف WASM (14.4MB) كان يُضمَّن في حزمة أندرويد دون أي استخدام.
dependency_overrides:
  sherpa_onnx_web:
    path: ../../packages/sherpa_onnx_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
