org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# تجميع Kotlin داخل Gradle يمنع فشل الاتصال بـ Kotlin compiler daemon على Windows.
kotlin.compiler.execution.strategy=in-process
# شبكة مشاركة الهاتف (USB tethering) متقطعة أحياناً: مهلات أطول وإعادة محاولات أكثر.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=2000
