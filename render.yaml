services:
  - type: web
    name: wizano-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    # NODE_ENV is production, but the TypeScript build and migration runner
    # are dev dependencies and are needed while Render prepares the service.
    buildCommand: npm ci --include=dev && npm run build
    # Free Render services do not support pre-deploy commands. Run database
    # migrations immediately before starting the API instead.
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wizano-db
          property: connectionString

databases:
  - name: wizano-db
    plan: free
    region: frankfurt
    databaseName: wizano
    user: wizano_app
